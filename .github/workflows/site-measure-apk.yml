name: 현장 포토 물량 AR - APK 빌드

on:
  push:
    branches: [site-measure-ar, main]
    paths:
      - 'SiteMeasureAR/**'
      - '.github/workflows/site-measure-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SiteMeasureAR
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d /tmp/clt
          mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - name: APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk SiteMeasureAR.apk

      - uses: actions/upload-artifact@v5
        with:
          name: SiteMeasureAR-apk
          path: SiteMeasureAR/SiteMeasureAR.apk

      - name: 릴리스에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: site-measure-ar-build-${{ github.run_number }}
          name: 현장 포토 물량 AR (빌드 ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: SiteMeasureAR/SiteMeasureAR.apk
          body: |
            포스코이앤씨 건축BIM섹션 · 현장 포토 물량 AR Android 시제품
            휴대폰에서 아래 SiteMeasureAR.apk를 눌러 내려받아 설치하세요.
            처음 설치할 때 '출처를 알 수 없는 앱' 허용이 필요합니다. 시험용 서명 빌드입니다.
